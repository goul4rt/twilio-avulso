// Twilio: quando a política bloqueia um endereço do Discord, mostra a página "use a variante Twilio" no lugar do aviso padrão.
// ponytail: atualização do Firefox apaga este arquivo; aí volta o aviso padrão (o bloqueio continua pela política)
try {
  const AVISO = "__AVISO__";
  const ehDiscord = h => /(^|\.)discord(app)?\.com$|^discord\.gg$/i.test(h || "");
  const ouvinte = {
    onLocationChange(browser, progress, request, location, flags) {
      if (!progress.isTopLevel || !(flags & Ci.nsIWebProgressListener.LOCATION_CHANGE_ERROR_PAGE)) return;
      let host = "";
      try { host = location.host; } catch (e) {}
      if (!ehDiscord(host)) return;
      browser.loadURI(Services.io.newURI(AVISO), {triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal()});
    }
  };
  const liga = win => { if (win.gBrowser && !win.__twilio) { win.__twilio = true; win.gBrowser.addTabsProgressListener(ouvinte); } };
  Services.obs.addObserver(win => {
    win.addEventListener("load", () => liga(win), {once: true});
  }, "domwindowopened");
  Services.obs.addObserver(win => liga(win), "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError(e);
}
